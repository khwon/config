font_family      Monaco
bold_font        Monaco
italic_font      Monaco
bold_italic_font Monaco
font_size        14.0
# Font for Korean
symbol_map U+AC00-U+D7A3,U+1100-U+11FF,U+3130-U+318F Apple SD Gothic Neo
# Shrink Monaco 14 cell width by 1px to match iTerm2's exact 8pt (16px) width,
# which divides 1512pt (189 cols) and 2560pt (320 cols) with 0px leftover!
modify_font           cell_width -1px

mouse_map cmd+left release grabbed,ungrabbed mouse_handle_click selection link prompt

map cmd+t new_tab
map cmd+w close_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

map cmd+enter toggle_fullscreen
