term xterm-256color

include ${KITTY_OS}.conf

# Match iTerm2's gamma/thickening on both macOS and Linux
text_composition_strategy legacy
macos_thicken_font        0.5

# Cut a clean gap in underlines around 'g', 'p', 'y' descenders (like iTerm2!)
underline_exclusion       2px

# =================
# Cursor (Solid non-blinking block)
# =================
cursor_shape          block
cursor_blink_interval 0
shell_integration     no-cursor

# =================
# Behavior: Drag-to-Copy, Cmd+Click Links, Left Option as Alt
# =================
copy_on_select      yes
macos_option_as_alt left

# =================
# Tabs
# =================
tab_bar_edge                top
tab_bar_style               separator
tab_separator               ""
tab_bar_min_tabs            2
tab_title_template          "{f'{fmt.fg._c1dcff}{fmt.bg._404040} | {fmt.fg.tab}{fmt.bg.tab}' if index > 1 else f'{fmt.bg._404040} {fmt.bg.tab}'}{index}: {title if (' - vim' in title.lower() or ' - nvim' in title.lower()) else title.split(':')[-1].strip() + ' (' + tab.active_exe + ')'}"
tab_title_max_length        35
# Tab bar colors & padding
tab_bar_margin_width        4.0
tab_bar_margin_height       5.0 5.0
tab_bar_margin_color        #404040
tab_bar_background          #404040
active_tab_foreground       #ffffff
active_tab_background       #404040
active_tab_font_style       bold
inactive_tab_foreground     #808080
inactive_tab_background     #404040
inactive_tab_font_style     normal

# =================
# Colors
# =================
background            #000000
foreground            #c7c7c7
cursor                #c7c7c7
cursor_text_color     #ffffff
selection_background  #c1dcff
selection_foreground  #000000

color0  #000000
color1  #ff6e67
color2  #5ffa68
color3  #fffc67
color4  #6871ff
color5  #ff77ff
color6  #60fdff
color7  #c7c7c7
color8  #686868
color9  #ff6e67
color10 #5ffa68
color11 #fffc67
color12 #6871ff
color13 #ff77ff
color14 #60fdff
color15 #ffffff

# Window size & tight margins
remember_window_size  no
initial_window_width  80c
initial_window_height 25c
window_padding_width  0
window_margin_width   0
inactive_text_alpha   1.0
enable_audio_bell     no
resize_in_steps       yes
placement_strategy    top
